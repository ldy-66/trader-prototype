<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>报单排序配置 · 客户配置</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px 36px;font:13px "Microsoft YaHei",sans-serif;color:#262626;background:#fff}
h1{font-size:16px;margin:0 0 18px}button,select{height:32px;padding:0 12px;background:white;border:1px solid #d9d9d9;border-radius:2px;color:inherit;font:inherit}
button{cursor:pointer}button:disabled{color:#aaa;background:#f5f5f5;cursor:default}.primary{background:#1890ff;border-color:#1890ff;color:#fff}
form{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}form label{display:flex;align-items:center;gap:8px}select{min-width:110px}.spacer{flex:1}
table{border-collapse:collapse;width:100%;border:1px solid #ddd;table-layout:fixed}th,td{padding:8px 12px;border-bottom:1px solid #eee;text-align:left;height:34px}th{background:#f3f4f4;font-weight:400;color:#595959}
.toggle{height:18px;width:18px;padding:0;line-height:16px}.check{width:44px;text-align:center}.expand{width:44px;text-align:center}
.detail-cell{background:#fafafa;padding:12px 20px}.empty{text-align:center;color:#777;height:92px}.pagination{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-top:16px}
dialog{border:1px solid #ddd;border-radius:5px;width:370px;padding:22px}dialog::backdrop{background:#0004}dialog footer{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}
</style>
</head>
<body>
<main>
<h1>客户配置</h1>
<form id="filters">
  <label>交易账户 <select id="account"><option value="">请选择</option></select></label>
  <label>业务类型 <select id="business"><option value="">全部</option><option>普通交易</option><option>融券交易</option></select></label>
  <label>交易方向 <select id="direction"><option value="">全部</option><option>买入</option><option>卖出</option></select></label>
  <button class="primary" type="submit">查询</button><button type="button" id="resetFilters">重置</button>
  <span class="spacer"></span><button type="button" id="remove" disabled>批量删除配置</button>
</form>
<section id="results" aria-label="客户配置查询结果"></section>
<div class="pagination"><span id="count" aria-live="polite"></span><button id="prev" type="button" aria-label="上一页">‹</button><span id="pageNumber"></span><button id="next" type="button" aria-label="下一页">›</button><select id="pageSize" aria-label="每页交易账户数"><option value="10">10 条/页</option><option value="20">20 条/页</option></select></div>
</main>
<dialog id="confirm" aria-labelledby="confirmTitle">
  <h2 id="confirmTitle">批量删除配置</h2><p id="prompt"></p>
  <form method="dialog"><span class="spacer"></span><button value="cancel">取消</button><button class="primary" value="delete">确认删除</button></form>
</dialog>
<script src="customer-config.js"></script>
</body>
</html>
